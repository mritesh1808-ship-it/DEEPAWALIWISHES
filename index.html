=\"art\" data-k=\"0\"><\/canvas><div class=\"photo\" style=\"--img:url(assets/images/card-happiness.jpg)\"><\/div><div class=\"txt\"><h2>HAPPINESS<\/h2><p>Every diya you light fills the home with laughter that stays long after the flame.<\/p><\/div><\/article>\n<article class=\"card\"><canvas class=\"art\" data-k=\"1\"><\/canvas><div class=\"photo\" style=\"--img:url(assets/images/card-prosperity.jpg)\"><\/div><div class=\"txt\"><h2>PROSPERITY<\/h2><p>May the year ahead open every door with abundance, growth and good fortune.<\/p><\/div><\/article>\n<article class=\"card\"><canvas class=\"art\" data-k=\"2\"><\/canvas><div class=\"photo\" style=\"--img:url(assets/images/card-love.jpg)\"><\/div><div class=\"txt\"><h2>LOVE<\/h2><p>Wishes shared with the people you love are the brightest light of the festival.<\/p><\/div><\/article>\n<article class=\"card\"><canvas class=\"art\" data-k=\"3\"><\/canvas><div class=\"photo\" style=\"--img:url(assets/images/card-dreams.jpg)\"><\/div><div class=\"txt\"><h2>DREAMS<\/h2><p>May every dream you carry rise like a skyshot and burst into something beautiful.<\/p><\/div><\/article>\n<\/div><button class=\"btn\" data-go=\"page3.html\">DISCOVER MORE MAGIC<\/button><\/section><\/main>\n<div class=\"veil on\"><\/div><script>/* Canvas firework engine: rockets, layered shells, trails, flashes, smoke. Idles itself when nothing is alive. */\nconst FW_COL={gold:[255,200,80],orange:[255,120,30],red:[255,70,80],pink:[255,100,180],blue:[90,160,255],cyan:[80,230,240],green:[120,255,140],purple:[180,110,255],white:[255,245,225]};\nconst FW_KEYS=Object.keys(FW_COL),fr=(a,b)=>a+Math.random()*(b-a);\nclass FireworkShow{\n constructor(c){this.c=c;this.p=[];this.k=[];this.sm=[];this.fl=[];this.sc=[];this.run=false;this.auto=false;this.acc=0;\n  const mk=(r,g)=>{const s=document.createElement('canvas');s.width=s.height=128;const x=s.getContext('2d'),q=x.createRadialGradient(64,64,0,64,64,64);g.forEach(([o,k])=>q.addColorStop(o,k));x.fillStyle=q;x.fillRect(0,0,128,128);return s};\n  this.flashS=mk(0,[[0,'rgba(255,240,200,1)'],[.3,'rgba(255,170,60,.45)'],[1,'rgba(255,120,20,0)']]);\n  this.smokeS=mk(0,[[0,'rgba(190,170,150,.6)'],[1,'rgba(120,100,90,0)']]);\n  this.resize();let t;addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(()=>this.resize(),200)})}\n resize(){const d=Math.min(devicePixelRatio||1,innerWidth<700?1.5:2);this.w=this.c.clientWidth||innerWidth;this.h=this.c.clientHeight||innerHeight;this.c.width=this.w*d;this.c.height=this.h*d;this.x=this.c.getContext('2d');this.x.setTransform(d,0,0,d,0,0);this.q=this.w<700?.6:1}\n start(){if(this.run)return;this.run=true;this.last=performance.now();requestAnimationFrame(t=>this.loop(t))}\n clear(){this.auto=false;this.p.length=this.k.length=this.sm.length=this.fl.length=this.sc.length=0;this.x.clearRect(0,0,this.w,this.h)}\n later(ms,f){this.sc.push({ms,f});this.start()}\n add(x,y,vx,vy,col,o={}){if(this.p.length>2600)return;this.p.push({x,y,vx,vy,l:1,dec:o.dec||1/fr(60,95),sz:o.sz||fr(1.2,2.3),s:`rgb(${col})`,gr:o.gr??.045,d:o.d||.965,cr:o.cr,tw:o.tw!==false})}\n launch(x0,y0,x1,y1,dur,cb){this.k.push({x0,y0,x1,y1,dur,t:0,cb,x:x0,y:y0,px:x0,py:y0});this.start()}\n shell(){const w=this.w,h=this.h,x=fr(.12,.88)*w,y=fr(.14,.42)*h;this.launch(x+fr(-30,30),h,x,y,fr(1100,1700),()=>this.explode(x,y))}\n explode(x,y,kind,col){kind=kind||['peony','ring','willow','crackle','double'][Math.random()*5|0];col=col||FW_COL[FW_KEYS[Math.random()*FW_KEYS.length|0]];this.flash(x,y);this.smoke(x,y,3);\n  if(kind==='peony')this.peony(x,y,col,120,fr(4.6,6));\n  else if(kind==='ring')this.ring(x,y,col,70,4.6);\n  else if(kind==='willow')this.willow(x,y,FW_COL.gold,90);\n  else if(kind==='crackle')this.peony(x,y,col,100,5,null,true);\n  else{this.peony(x,y,col,110,5.8);this.peony(x,y,FW_COL.white,60,3,null,false,.6)}}\n peony(x,y,col,n,v,col2,cr,sp){n=n*this.q|0;for(let i=0;i<n;i++){const a=fr(0,6.283),z=fr(-1,1),r=Math.sqrt(1-z*z),s=v*(.75+.25*Math.random())*(sp||1),c=col2&&i%3===0?col2:col;this.add(x,y,Math.cos(a)*r*s,Math.sin(a)*r*s,c,{cr})}}\n ring(x,y,col,n,v){n=n*this.q|0;const t=fr(0,3.14),ry=fr(.35,1),ct=Math.cos(t),st=Math.sin(t);for(let i=0;i<n;i++){const a=i/n*6.283,vx=Math.cos(a)*v,vy=Math.sin(a)*v*ry;this.add(x,y,vx*ct-vy*st,vx*st+vy*ct,col,{d:.972,dec:1/fr(70,90)})}}\n willow(x,y,col,n){n=n*this.q|0;for(let i=0;i<n;i++){const a=fr(0,6.283),s=fr(1.5,5);this.add(x,y,Math.cos(a)*s,Math.sin(a)*s,col,{d:.978,gr:.05,dec:1/fr(110,170),sz:1.5})}}\n flash(x,y){this.fl.push({x,y,l:1})}\n smoke(x,y,n){for(let i=0;i<n;i++)this.sm.push({x:x+fr(-40,40),y:y+fr(-30,30),vx:fr(-.15,.15),vy:fr(-.1,.12),r:fr(50,90),l:1})}\n combo(x,y){const P=FW_COL,w=this.w,h=this.h;this.flash(x,y);this.smoke(x,y,6);this.willow(x,y,P.gold,120);this.peony(x,y,P.pink,150,6.4,P.gold);this.ring(x,y,P.cyan,80,5);\n  this.later(300,()=>{for(let i=0;i<5;i++){const sx=x+fr(-.3,.3)*w,sy=y+fr(-.12,.2)*h;this.flash(sx,sy);this.peony(sx,sy,FW_COL[FW_KEYS[Math.random()*8|0]],80,fr(3.5,5))}});\n  this.later(750,()=>{this.flash(x,y);this.peony(x,y,P.gold,120,5.5,null,true)})}\n loop(t){if(!this.run)return;const dt=Math.min((t-this.last)/16.667,2.5);this.last=t;const x=this.x;\n  x.globalCompositeOperation='destination-out';x.fillStyle=`rgba(0,0,0,${Math.min(.35,.17*dt)})`;x.fillRect(0,0,this.w,this.h);x.globalCompositeOperation='lighter';\n  for(let i=this.sc.length-1;i>=0;i--){const s=this.sc[i];if((s.ms-=dt*16.667)<=0){this.sc.splice(i,1);s.f()}}\n  if(this.auto&&(this.acc-=dt*16.667)<=0){this.shell();this.acc=fr(500,1300)}\n  for(let i=this.k.length-1;i>=0;i--){const r=this.k[i];r.t+=dt*16.667;const u=Math.min(r.t/r.dur,1),e=1-Math.pow(1-u,2.6);r.px=r.x;r.py=r.y;r.x=r.x0+(r.x1-r.x0)*e+Math.sin(u*16)*(1-u)*3;r.y=r.y0+(r.y1-r.y0)*e;\n   for(let j=0;j<3;j++)this.add(r.x,r.y,fr(-.4,.4),fr(.2,1.2),[255,fr(150,215)|0,60],{gr:.03,d:.96,dec:1/fr(28,55),sz:fr(.8,1.8)});\n   x.strokeStyle='rgba(255,215,120,.9)';x.lineWidth=2.6;x.lineCap='round';x.beginPath();x.moveTo(r.px,r.py);x.lineTo(r.x,r.y);x.stroke();\n   x.globalAlpha=.9;x.drawImage(this.flashS,r.x-16,r.y-16,32,32);x.globalAlpha=1;\n   if(u>=1){this.k.splice(i,1);r.cb&&r.cb()}}\n  for(let i=this.fl.length-1;i>=0;i--){const f=this.fl[i];x.globalAlpha=f.l*.5;const s=Math.max(this.w,this.h)*.7;x.drawImage(this.flashS,f.x-s/2,f.y-s/2,s,s);f.l-=.07*dt;if(f.l<=0)this.fl.splice(i,1)}\n  x.globalAlpha=1;\n  for(let i=this.p.length-1;i>=0;i--){const p=this.p[i];p.vx*=Math.pow(p.d,dt);p.vy=p.vy*Math.pow(p.d,dt)+p.gr*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=p.dec*dt;\n   if(p.l<=0){if(p.cr&&this.p.length<2000)for(let j=0;j<3;j++)this.add(p.x,p.y,fr(-1.5,1.5),fr(-1.5,1.5),FW_COL.white,{dec:1/fr(12,22),sz:1.1,gr:.02,d:.92});this.p[i]=this.p[this.p.length-1];this.p.pop();continue}\n   x.globalAlpha=Math.min(1,p.l*1.4)*(p.tw&&p.l<.5?fr(.5,1):1);x.fillStyle=p.s;x.beginPath();x.arc(p.x,p.y,p.sz*(.55+.45*p.l),0,6.283);x.fill()}\n  x.globalAlpha=1;x.globalCompositeOperation='source-over';\n  for(let i=this.sm.length-1;i>=0;i--){const s=this.sm[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.r+=.35*dt;s.l-=.004*dt;if(s.l<=0){this.sm.splice(i,1);continue}x.globalAlpha=s.l*.14;x.drawImage(this.smokeS,s.x-s.r,s.y-s.r,s.r*2,s.r*2)}\n  x.globalAlpha=1;\n  if(!this.auto&&!this.p.length&&!this.k.length&&!this.sm.length&&!this.fl.length&&!this.sc.length){x.clearRect(0,0,this.w,this.h);this.run=false;return}\n  requestAnimationFrame(t=>this.loop(t))}\n}\n<\/script><script>const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)],rnd=(a,b)=>a+Math.random()*(b-a);\nconst RM=matchMedia('(prefers-reduced-motion: reduce)').matches,small=()=>innerWidth<700,page=document.body.dataset.page,TAU=6.2832;\nfunction fit(c){const d=Math.min(devicePixelRatio||1,small()?1.5:2),w=c.clientWidth||innerWidth,h=c.clientHeight||innerHeight;c.width=w*d;c.height=h*d;const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return{x,w,h}}\nfunction glow(r,st){const c=document.createElement('canvas');c.width=c.height=r*2;const x=c.getContext('2d'),g=x.createRadialGradient(r,r,0,r,r,r);st.forEach(([o,k])=>g.addColorStop(o,k));x.fillStyle=g;x.fillRect(0,0,r*2,r*2);return c}\n/* one shared animation loop, paused when the tab is hidden, stopped when empty */\nconst Loop=(()=>{const f=new Set();let id=0;const t=n=>{f.forEach(g=>g(n));id=requestAnimationFrame(t)};return{add(g){f.add(g);if(!id)id=requestAnimationFrame(t)},del(g){f.delete(g);if(!f.size){cancelAnimationFrame(id);id=0}},pause(){cancelAnimationFrame(id);id=0},resume(){if(f.size&&!id)id=requestAnimationFrame(t)}}})();\ndocument.addEventListener('visibilitychange',()=>document.hidden?Loop.pause():Loop.resume());\n/* transitions */\nconst veil=$('.veil');requestAnimationFrame(()=>requestAnimationFrame(()=>veil.classList.remove('on')));\naddEventListener('pageshow',()=>veil.classList.remove('on'));\nconst go=u=>{veil.classList.add('on');setTimeout(()=>parent.postMessage({go:u},'*'),650)};\n$$('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));\n$$('[data-split]').forEach(el=>{const t=el.textContent;el.textContent='';el.setAttribute('aria-label',t);let i=0;t.split(' ').forEach(w=>{const s=document.createElement('span');s.className='w';s.setAttribute('aria-hidden','true');[...w].forEach(ch=>{const c=document.createElement('span');c.className='ch';c.style.setProperty('--i',i++);c.textContent=ch;s.append(c)});el.append(s,' ')})});\n/* parallax (pointer + device tilt) */\nconst PX={x:0,y:0,tx:0,ty:0};\naddEventListener('pointermove',e=>{PX.tx=(e.clientX/innerWidth-.5)*2;PX.ty=(e.clientY/innerHeight-.5)*2},{passive:true});\naddEventListener('deviceorientation',e=>{if(e.gamma==null)return;PX.tx=Math.max(-1,Math.min(1,e.gamma/25));PX.ty=Math.max(-1,Math.min(1,(e.beta-45)/25))},{passive:true});\nif(!RM&&$('.par'))Loop.add(()=>{PX.x+=(PX.tx-PX.x)*.06;PX.y+=(PX.ty-PX.y)*.06;const s=document.documentElement.style;s.setProperty('--px',PX.x.toFixed(3));s.setProperty('--py',PX.y.toFixed(3))});\n/* rebuild static canvases on real size changes only */\nconst builders=[];let rt,lw=innerWidth,lh=innerHeight;\naddEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(innerWidth===lw&&Math.abs(innerHeight-lh)<120)return;lw=innerWidth;lh=innerHeight;builders.forEach(f=>f())},250)});\n/* ---------- scenery ---------- */\nfunction paintSky(x,w,h){const g=x.createLinearGradient(0,0,0,h);[[0,'#01030a'],[.5,'#061029'],[.82,'#14193a'],[1,'#3b1c0e']].forEach(([o,k])=>g.addColorStop(o,k));x.fillStyle=g;x.fillRect(0,0,w,h);\n const z=x.createRadialGradient(w/2,h*.95,0,w/2,h*.95,h*.75);z.addColorStop(0,'rgba(255,140,40,.38)');z.addColorStop(1,'rgba(255,140,40,0)');x.fillStyle=z;x.fillRect(0,0,w,h);\n x.fillStyle='#fff';for(let i=0;i<(small()?110:250);i++){x.globalAlpha=rnd(.15,.9);x.beginPath();x.arc(rnd(0,w),rnd(0,h*.72),Math.random()<.06?1.6:rnd(.4,1),0,TAU);x.fill()}x.globalAlpha=1}\nfunction skyline(x,w,base,col,a){x.fillStyle=col;x.globalAlpha=a;let px=-10;while(px<w){const bw=rnd(34,90),bh=rnd(.03,.1)*base+10;x.fillRect(px,base-bh,bw,bh+400);if(Math.random()<.45){const r=bw*.32;x.beginPath();x.ellipse(px+bw/2,base-bh,r,r*1.1,0,Math.PI,0);x.fill();x.fillRect(px+bw/2-1,base-bh-r*1.1-10,2,10)}px+=bw+rnd(0,8)}x.globalAlpha=1}\nfunction bokeh(x,w,h,n,cols,y0=0,y1=1){const s=glow(40,[[0,'rgba(255,255,255,.04)'],[.72,'rgba(255,255,255,.2)'],[.92,'rgba(255,255,255,.55)'],[1,'rgba(255,255,255,0)']]);x.globalCompositeOperation='lighter';for(let i=0;i<n;i++){const r=rnd(10,small()?40:70),px=rnd(0,w),py=rnd(y0,y1)*h;x.globalAlpha=rnd(.08,.3);x.fillStyle=cols[i%cols.length];x.beginPath();x.arc(px,py,r,0,TAU);x.fill();x.globalAlpha=rnd(.04,.12);x.drawImage(s,px-r,py-r,r*2,r*2)}x.globalAlpha=1;x.globalCompositeOperation='source-over'}\nfunction rangoli(x,cx,cy,R){x.save();x.translate(cx,cy);x.scale(1,.26);x.globalAlpha=.92;[[1,26,'#ff8a1f','#ffd25a'],[.8,18,'#e8316a','#ffb347'],[.6,14,'#fff1b8','#ff8a1f'],[.4,10,'#ffb347','#e8316a'],[.2,6,'#ffd25a','#ff6a00']].forEach(([f,n,a,b])=>{for(let i=0;i<n;i++){x.save()
